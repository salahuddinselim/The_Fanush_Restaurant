<div class="admin-layout">
  <aside class="admin-sidebar">
    <h2>Restaurant CMS</h2>
    <a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/admin/config" routerLinkActive="active">Site Settings</a>
    <a routerLink="/admin/menu" routerLinkActive="active">Menu</a>
    <a routerLink="/admin/gallery" routerLinkActive="active">Gallery</a>
    <a routerLink="/admin/hours" routerLinkActive="active">Hours</a>
    <a routerLink="/admin/reservations" routerLinkActive="active">Reservations</a>
    <a routerLink="/" style="margin-top:12px;opacity:.6">← View Site</a>
    <div class="logout"><a (click)="auth.logout()" style="cursor:pointer;color:rgba(255,255,255,.5)">Sign Out</a></div>
  </aside>
  <main class="admin-main">
    <h1 class="admin-title">Opening Hours</h1>
    <div class="admin-card">
      <table class="data-table">
        <thead><tr><th>Day</th><th>Open</th><th>Close</th><th>Closed</th><th></th></tr></thead>
        <tbody>
          <tr *ngFor="let h of hours; let i = index" [class.muted-row]="h.is_closed">
            <td><b>{{ dayName(h) }}</b></td>
            <td><input type="time" [(ngModel)]="h.open_time" [disabled]="h.is_closed" style="width:110px"></td>
            <td><input type="time" [(ngModel)]="h.close_time" [disabled]="h.is_closed" style="width:110px"></td>
            <td><input type="checkbox" [(ngModel)]="h.is_closed"></td>
            <td>
              <button class="btn btn-gold btn-sm" (click)="save(h, i)" [disabled]="saving === i">
                {{ saving === i ? '…' : 'Save' }}
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
