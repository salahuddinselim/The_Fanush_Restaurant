<main class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-mark"><span>F</span></div>
      <span class="login-title">Restaurant CMS</span>
      <span class="login-sub">Admin Panel</span>
    </div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" formControlName="username" type="text" autocomplete="username">
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" formControlName="password" type="password" autocomplete="current-password">
      </div>
      <div *ngIf="error" class="login-error" role="alert">{{ error }}</div>
      <button type="submit" class="btn login-submit" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>
  </div>
</main>
