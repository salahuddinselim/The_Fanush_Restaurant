<div class="admin-layout">
  <aside class="admin-sidebar">
    <h2>Restaurant CMS</h2>
    <a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/admin/config" routerLinkActive="active">Site Settings</a>
    <a routerLink="/admin/menu" routerLinkActive="active">Menu</a>
    <a routerLink="/admin/gallery" routerLinkActive="active">Gallery</a>
    <a routerLink="/admin/hours" routerLinkActive="active">Hours</a>
    <a routerLink="/admin/reservations" routerLinkActive="active">Reservations</a>
    <a routerLink="/" style="margin-top:12px;opacity:.6">← View Site</a>
    <div class="logout"><a (click)="auth.logout()" style="cursor:pointer;color:rgba(255,255,255,.5)">Sign Out</a></div>
  </aside>
  <main class="admin-main">
    <h1 class="admin-title">Gallery</h1>
    <div class="admin-card">
      <h3 style="margin-bottom:16px">Upload New Image</h3>
      <div class="row2">
        <div class="field"><label>Caption</label><input type="text" [(ngModel)]="caption" placeholder="Optional caption"></div>
        <div class="field"><label>Image File</label><input type="file" accept="image/*" (change)="onFile($event)" [disabled]="uploading"></div>
      </div>
      <p *ngIf="uploading" style="color:var(--muted)">Uploading…</p>
    </div>
    <div class="gal-admin-grid">
      <div *ngFor="let img of images" class="gal-admin-card" [class.inactive]="!img.is_active">
        <img [src]="apiBase + img.image_url" [alt]="img.caption || ''" class="gal-thumb">
        <div class="gal-info">
          <span class="gal-caption">{{ img.caption || '(no caption)' }}</span>
          <div class="gal-actions">
            <button class="btn btn-outline btn-sm" (click)="toggle(img)">{{ img.is_active ? 'Hide' : 'Show' }}</button>
            <button class="btn btn-danger btn-sm" (click)="delete(img.id)">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
