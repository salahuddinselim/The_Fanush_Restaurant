<app-admin-shell>
    <div class="admin-topbar">
      <h1 class="admin-page-title">Reservations <span>{{ reservations.length }} total bookings</span></h1>
      <div class="res-filter-pills">
        <span class="res-pill all" [class.active]="filter === 'all'" (click)="filter = 'all'">All</span>
        <span class="res-pill pending" [class.active]="filter === 'pending'" (click)="filter = 'pending'">Pending</span>
        <span class="res-pill confirmed" [class.active]="filter === 'confirmed'" (click)="filter = 'confirmed'">Confirmed</span>
        <span class="res-pill cancelled" [class.active]="filter === 'cancelled'" (click)="filter = 'cancelled'">Cancelled</span>
      </div>
    </div>
    <div class="admin-card" style="overflow-x:auto">
      <table class="data-table">
        <thead>
          <tr>
            <th>Guest</th><th>Date &amp; Time</th><th>Party</th><th>Contact</th><th>Notes</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of filtered">
            <td><b>{{ r.name }}</b></td>
            <td>
              <b>{{ r.date }}</b><br>
              <span style="color:var(--ink-soft);font-size:12px">{{ r.time }}</span>
            </td>
            <td><span class="party-badge">{{ r.party_size }} guests</span></td>
            <td style="font-size:13px">
              <div>{{ r.email }}</div>
              <div style="color:var(--ink-soft)">{{ r.phone }}</div>
            </td>
            <td style="max-width:140px;font-size:12px;color:var(--ink-soft)">{{ r.notes || '—' }}</td>
            <td><span class="badge badge-{{ r.status }}">{{ r.status }}</span></td>
            <td>
              <div class="action-row">
                <button *ngIf="r.status !== 'confirmed'" class="btn gold sm" (click)="setStatus(r.id, 'confirmed')">Confirm</button>
                <button *ngIf="r.status !== 'cancelled'" class="btn ghost sm" (click)="setStatus(r.id, 'cancelled')">Cancel</button>
                <button class="btn danger sm" (click)="delete(r.id)">Delete</button>
              </div>
            </td>
          </tr>
          <tr *ngIf="filtered.length === 0">
            <td colspan="7" class="empty-row">No reservations found.</td>
          </tr>
        </tbody>
      </table>
    </div>
</app-admin-shell>
